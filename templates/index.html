<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notes App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📝 Notes App</h1>

        <form method="POST">
            <input type="text" name="note" placeholder="Write a note..." required>
            <button type="submit">Add Note</button>
        </form>

        <ul>
            {% for note in notes %}
            <li>
                {{ note }}
                <a href="/delete/{{ loop.index0 }}">❌</a>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
